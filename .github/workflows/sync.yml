name: Sync calendars and publish

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 * * * *"   # every hour
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch and encrypt linked calendars
        run: node scripts/sync.mjs
        env:
          CALENDAR_FEEDS: ${{ secrets.CALENDAR_FEEDS }}
          PLANNER_PASSPHRASE: ${{ secrets.PLANNER_PASSPHRASE }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
